<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mono — 临期界定区间</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── 内联 MONO.CARD_CSS（保持 mono-tokens.js 为唯一正本） ── */
:root{--bg:#F0EFEB;--dark:#1C1C1A;--ink:#1C1C1A;--muted:#8F8E88;--faint:#C6C5BF;--grid:#DEDDD6}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Inter','Microsoft YaHei','PingFang SC',sans-serif;color:var(--ink);padding:28px;-webkit-font-smoothing:antialiased}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:1400px;margin:0 auto}
.card{background:var(--bg);border-radius:24px;padding:28px 28px 20px}
.card.wide{grid-column:1/-1}
h2{font-weight:700;font-size:16.5px;letter-spacing:-.02em;margin-bottom:3px}
.sub{font-size:11.5px;color:var(--muted);margin-bottom:14px}
.src{font-size:9.5px;color:var(--faint);margin-top:10px;letter-spacing:.08em;font-weight:500}
.ch{height:320px}
svg text{font-family:'Inter','Microsoft YaHei','PingFang SC',sans-serif}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.7,.3,1.3) both}
@keyframes pop{from{transform:scale(0)}to{transform:none}}
.fade{animation:fade .9s ease both}
@keyframes fade{from{opacity:0}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.4,0,.2,1) both}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.pop,.fade{animation:none}.draw{animation:none;stroke-dasharray:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="grid2">
  <div class="card wide">
    <h2>保质期越长，临期窗口越宽</h2>
    <div class="sub">空心 = 区间下限 · 实心 = 区间上限 · 串珠 = 区间内每一天 · 制度表 1</div>
    <svg id="dq" viewBox="0 0 400 320" preserveAspectRatio="xMidYMid meet" role="img" aria-label="制度表1临期界定区间：一年以上30到45天，半年以上不足一年20到30天，30天以上不足半年7到20天，不足30天1到5天"></svg>
    <div class="src">F12 DUMBBELL QUEUE · 制度表1 · 加油站非油业务管理办法</div>
  </div>
</div>
<script>
/* ═══════════════════════════════════════════════════════════════
   MONO TOKENS — 内联正本（摘自 mono-tokens.js，未改色值与动画参数）
   ═══════════════════════════════════════════════════════════════ */
(function (global) {
  'use strict';
  const INK   = '#1C1C1A';
  const PAPER = '#F0EFEB';
  const MUTED = '#8F8E88';
  const FAINT = '#C6C5BF';
  const GRID  = '#DEDDD6';
  const L   = ['#1C1C1A', '#4A4944', '#6A6963', '#8F8E88', '#B0AFA9', '#C6C5BF', '#D8D7D1'];
  const LAD = ['#1C1C1A', '#4A4944', '#8F8E88', '#B0AFA9', '#D8D7D1'];
  const DARK = {
    bg: '#1C1C1A', ink: '#F0EFEB', muted: '#8F8E88', faint: '#55554F',
    grid: '#2E2D29', gridSoft: '#2A2925',
    ladder: ['#F0EFEB', '#DCDAD2', '#C9C7BD', '#B3B0A4', '#8F8E88', '#6A6963', '#4A4944']
  };
  const FONT = {
    family: 'Inter',
    link: 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap',
    title:    { size: 16.5, weight: 700, spacing: '-.02em' },
    titleBig: { size: 19,   weight: 700, spacing: '-.02em' },
    sub:      { size: 11.5, weight: 400 },
    src:      { size: 9.5,  weight: 500, spacing: '.08em' },
    value:    { weight: 800 },
    axis:     { size: 9.5,  weight: 600 },
    minHalf: 6.5, minWide: 5.5
  };
  const SHAPE = { cardRadius: 24, cardPad: '28px 28px 20px', barRadius: 99, tooltipRadius: 12 };
  const MOTION = {
    enter: 900, enterSlow: 1200, easing: 'quarticOut', staggerDot: 12, staggerBar: 100,
    css: ''
  };
  const tipLight = { backgroundColor: INK, borderWidth: 0, padding: [10, 14], textStyle: { color: PAPER, fontFamily: 'Inter', fontSize: 12 } };
  const tipDark  = { backgroundColor: PAPER, borderWidth: 0, padding: [10, 14], textStyle: { color: INK, fontFamily: 'Inter', fontSize: 12 } };
  const rnd = (i, k) => Math.abs(((i * 73856093) ^ (k * 19349663)) % 1000) / 1000;
  const D2R = Math.PI / 180;
  const pol = (cx, cy, r, deg) => [cx + r * Math.cos(deg * D2R), cy + r * Math.sin(deg * D2R)];
  const sect = (cx, cy, r0, r1, a0, a1) => {
    const big = a1 - a0 > 180 ? 1 : 0;
    const [xa, ya] = pol(cx, cy, r1, a0), [xb, yb] = pol(cx, cy, r1, a1);
    const [xc, yc] = pol(cx, cy, r0, a1), [xd, yd] = pol(cx, cy, r0, a0);
    return `M${xa} ${ya} A${r1} ${r1} 0 ${big} 1 ${xb} ${yb} L${xc} ${yc} A${r0} ${r0} 0 ${big} 0 ${xd} ${yd} Z`;
  };
  const blob = (x, y, r, seed) => {
    const n = Math.max(14, Math.round(r * 1.6)), pts = [];
    for (let t = 0; t < n; t++) {
      const a = t / n * Math.PI * 2;
      const w = 1 + .055 * Math.sin(a * 2 + seed * 7) + .04 * Math.sin(a * 3 + seed * 13)
              + (rnd(seed + t, 3) - .5) * .03;
      pts.push([x + Math.cos(a) * r * w, y + Math.sin(a) * r * w]);
    }
    let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for (let t = 0; t < n; t++) {
      const p = pts[t], q = pts[(t + 1) % n];
      d += ` Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${((p[0]+q[0])/2).toFixed(1)} ${((p[1]+q[1])/2).toFixed(1)}`;
    }
    return d + ' Z';
  };
  const NS = 'http://www.w3.org/2000/svg';
  const el  = (p, t, a) => { const n = document.createElementNS(NS, t);
    for (const k in a) n.setAttribute(k, a[k]); p.appendChild(n); return n; };
  const txt = (p, a, s) => { const n = el(p, 'text', a); n.textContent = s; return n; };
  const tip = (n, s) => { const t = document.createElementNS(NS, 'title');
    t.textContent = s; n.appendChild(t); };
  const timers = {};
  const keep = (id, t) => { (timers[id] = timers[id] || []).push(t); };
  const obsReveal = (id, fn) => {
    const n = document.getElementById(id);
    const go = () => {
      (timers[id] || []).forEach(clearInterval); timers[id] = [];
      if (n.tagName === 'svg' || n.tagName === 'SVG') n.innerHTML = '';
      fn(n);
    };
    const io = new IntersectionObserver(es => {
      if (es[0].isIntersecting) { go(); io.disconnect(); }
    }, { threshold: .3 });
    io.observe(n);
    n.style.cursor = 'pointer';
    n.addEventListener('click', go);
  };
  const eReveal = (id, opt) => obsReveal(id, elDom => {
    const g = echarts.getInstanceByDom(elDom) || echarts.init(elDom);
    g.clear(); g.setOption(opt);
  });
  global.MONO = { INK, PAPER, MUTED, FAINT, GRID, L, LAD, DARK,
    FONT, SHAPE, MOTION, tipLight, tipDark,
    rnd, pol, sect, blob, el, txt, tip, obsReveal, eReveal, keep, CARD_CSS: '' };
})(typeof window !== 'undefined' ? window : globalThis);

/* ════ F12 · Dumbbell Queue（制度表1区间版） ════
   骨架来自 basics-gallery.html C8：一条横向轨道 + 空心/实心两端 + 轨道串珠。
   这里把「前后对比」翻译为「临期区间下限～上限」，一珠 = 1 天，诚实可数。 */
(()=>{
  const D = [
    ['一年以上', 30, 45],
    ['半年以上不足一年', 20, 30],
    ['30天以上不足半年', 7, 20],
    ['不足30天', 1, 5]
  ];
  MONO.obsReveal('dq', s => {
    const { el, txt, tip, rnd, INK, PAPER, MUTED, FAINT, GRID } = MONO;
    const X0 = 140, X1 = 366, y0 = i => 54 + i * 52;
    const mapX = v => X0 + (v - 1) / 44 * (X1 - X0);

    /* 环境结构：刻度导轨（先画，压在数据下方） */
    [1, 10, 20, 30, 45].forEach((v, k) => {
      const x = mapX(v);
      el(s, 'line', { x1:x, y1:34, x2:x, y2:270, stroke:GRID, 'stroke-width':.7,
        class:'fade', style:`animation-delay:${k*.05}s` });
      txt(s, { x:x, y:286, 'font-size':7, 'font-weight':600, fill:FAINT,
        'text-anchor':'middle', class:'fade', style:`animation-delay:${k*.05}s` }, v);
    });
    txt(s, { x:(X0+X1)/2, y:305, 'font-size':7, 'font-weight':700, fill:MUTED,
      'text-anchor':'middle', 'letter-spacing':'.1em', class:'fade', style:'animation-delay:.4s' },
      'REMAINING SHELF LIFE · DAYS');

    D.forEach(([name, lo, hi], i) => {
      const y = y0(i), xa = mapX(lo), xb = mapX(hi), delay = i * .08;

      txt(s, { x:130, y:y+3, 'font-size':7.4, 'font-weight':700, fill:MUTED,
        'text-anchor':'end', 'letter-spacing':'.02em', class:'fade', style:`animation-delay:${delay}s` }, name);

      el(s, 'line', { x1:X0-6, y1:y, x2:X1+6, y2:y, stroke:GRID, 'stroke-width':.7,
        class:'fade', style:`animation-delay:${delay}s` });

      /* 一珠 = 1 天：区间内每天都可数 */
      const n = hi - lo + 1;
      for (let k = 0; k < n; k++) {
        const t = (k + .5) / n;
        const x = xa + t * (xb - xa);
        const yy = y + (rnd(k + 1, i + 3) - .5) * 2.4;
        el(s, 'circle', { cx:x, cy:yy, r:1.35 + rnd(k + 2, i + 4) * .75, fill:'#8F8E88',
          opacity:.85, class:'pop', style:`animation-delay:${.25 + delay + k*.012}s` });
      }

      const lower = el(s, 'circle', { cx:xa, cy:y, r:4.2, fill:PAPER, stroke:INK,
        'stroke-width':1.3, class:'pop', style:`animation-delay:${.2 + delay}s` });
      tip(lower, name + '：下限 ' + lo + ' 天（空心）');

      const upper = el(s, 'circle', { cx:xb, cy:y, r:4.6, fill:INK,
        class:'pop', style:`animation-delay:${.6 + delay}s` });
      tip(upper, name + '：上限 ' + hi + ' 天（实心）');

      if (xb - xa < 70) {
        /* 区间短时上下错开，避免两个天数标签互相压住 */
        txt(s, { x:xa, y:y + 15, 'font-size':8, 'font-weight':700, fill:MUTED,
          'text-anchor':'middle', class:'fade', style:`animation-delay:${.3 + delay}s` }, lo + '天');
        txt(s, { x:xb, y:y - 9, 'font-size':9, 'font-weight':800, fill:INK,
          'text-anchor':'middle', class:'fade', style:`animation-delay:${.7 + delay}s` }, hi + '天');
      } else {
        txt(s, { x:xa + 9, y:y - 8, 'font-size':8, 'font-weight':700, fill:MUTED,
          class:'fade', style:`animation-delay:${.3 + delay}s` }, lo + '天');
        txt(s, { x:xb - 9, y:y - 8, 'font-size':9, 'font-weight':800, fill:INK,
          'text-anchor':'end', class:'fade', style:`animation-delay:${.7 + delay}s` }, hi + '天');
      }
    });
  });
})();
</script>
</body>
</html>
